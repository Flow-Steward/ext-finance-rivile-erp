- component_id: operations_everyday
  type: markdown
  title: Everyday operations
  body: |
    These steps take plain inputs and make the Rivile ERP calls for you. Every Rivile ERP endpoint is also available on its own, as **Advanced · …** — see **Advanced endpoints** below.

    ### Test the connection

    Checks the API key with Rivile ERP's own key check (GET /v1/users/api-keys), read-only.

    - Action id: `test_connection`
    - Kind: read
    - Rivile ERP calls: `GET /v1/users/api-keys`
    - Inputs: none
    - Results: `connected`, `service_status`, `duration_ms`, `http_status`

    ### Find or create customer / supplier

    Looks the client up by client code, then registration code, then VAT number (GET /v1/clients); several matches or conflicting codes are an error. Creates it (POST /v1/clients) only when none matches, so running it again is safe — but not two runs at the same time.

    - Action id: `find_or_create_client`
    - Kind: write
    - Rivile ERP calls: `GET /v1/clients`, `POST /v1/clients`
    - Inputs: `client_code` (optional), `reg_code` (optional), `vat_number` (optional), `name` (optional), `client_type` (optional), `address` (optional), `email` (optional), `phone` (optional), `is_customer` (optional), `is_supplier` (optional)
    - Results: `client_id`, `client_code`, `created`, `matched_by`, `record`

    ### Create sales invoice

    Creates a sales invoice with its lines (POST /v1/sale-invoices), finding or creating the client first when no client code is given; lines beyond the first 100 are added one by one, and it can post the document. If a later call fails, the step says exactly what was already created and is not retried.

    - Action id: `create_sales_invoice`
    - Kind: write
    - Rivile ERP calls: `GET /v1/clients`, `POST /v1/clients`, `GET /v1/sale-invoices`, `POST /v1/sale-invoices`, `POST /v1/sale-invoices/{id}/lines`, `PATCH /v1/sale-invoices/{id}/post`
    - Inputs: `client_code` (optional), `reg_code` (optional), `vat_number` (optional), `name` (optional), `client_type` (optional), `address` (optional), `email` (optional), `phone` (optional), `is_customer` (optional), `is_supplier` (optional), `number` (optional), `date` (optional), `document_date` (optional), `department_code`, `currency_code` (optional), `prices_include_tax` (optional), `notes` (optional), `lines`, `post` (optional)
    - Results: `document_id`, `number`, `created`, `client_code`, `client_created`, `lines_created`, `total_amount`, `total_tax`, `posted`, `record`

    ### Create purchase invoice

    Creates a purchase invoice with its lines (POST /v1/purchase-invoices), finding or creating the client first when no client code is given; lines beyond the first 100 are added one by one, and it can post the document. If a later call fails, the step says exactly what was already created and is not retried.

    - Action id: `create_purchase_invoice`
    - Kind: write
    - Rivile ERP calls: `GET /v1/clients`, `POST /v1/clients`, `GET /v1/purchase-invoices`, `POST /v1/purchase-invoices`, `POST /v1/purchase-invoices/{id}/lines`, `PATCH /v1/purchase-invoices/{id}/post`
    - Inputs: `client_code` (optional), `reg_code` (optional), `vat_number` (optional), `name` (optional), `client_type` (optional), `address` (optional), `email` (optional), `phone` (optional), `is_customer` (optional), `is_supplier` (optional), `number` (optional), `date` (optional), `document_date` (optional), `department_code`, `currency_code` (optional), `prices_include_tax` (optional), `notes` (optional), `lines`, `post` (optional)
    - Results: `document_id`, `number`, `created`, `client_code`, `client_created`, `lines_created`, `total_amount`, `total_tax`, `posted`, `record`

    ### Download document file

    Saves a file attached in Rivile ERP as a workflow file (GET /v1/files/{id}/content). Give the file id, or a document type and id to take its attachment (by name, or the first one).

    - Action id: `download_document_file`
    - Kind: read
    - Rivile ERP calls: `GET /v1/files/{id}/content`, `GET of the document`
    - Inputs: `file_id` (optional), `document_type` (optional), `document_id` (optional), `file_name` (optional)
    - Results: `found`, `document_file`, `file_id`, `original_filename`, `size_bytes`

    ### Register payment

    Creates a payment received or sent (POST /v1/payments) and, when an invoice id is given, links it to that invoice (PATCH /v1/payments/{id}/link-payment).

    - Action id: `register_payment`
    - Kind: write
    - Rivile ERP calls: `POST /v1/payments`, `PATCH /v1/payments/{id}/link-payment`, `PATCH /v1/payments/{id}/post`
    - Inputs: `direction`, `client_code`, `amount`, `currency_code` (optional), `date` (optional), `account_code` (optional), `payment_method_code` (optional), `document_no` (optional), `purpose` (optional), `invoice_id` (optional), `invoice_type` (optional), `post` (optional)
    - Results: `payment_id`, `linked`, `posted`, `record`

    ### Find or create product

    Looks the product up by code, then barcode (GET /v1/products); creates it (POST /v1/products) only when none matches.

    - Action id: `find_or_create_product`
    - Kind: write
    - Rivile ERP calls: `GET /v1/products`, `POST /v1/products`
    - Inputs: `product_code` (optional), `barcode` (optional), `name` (optional), `product_type` (optional), `unit` (optional), `description` (optional)
    - Results: `product_id`, `product_code`, `created`, `matched_by`, `record`

    ### Stock levels

    Quantities on hand per product and department (GET /v1/inventory-stocks).

    - Action id: `stock_levels`
    - Kind: read
    - Rivile ERP calls: `GET /v1/inventory-stocks`
    - Inputs: `product_code` (optional), `department_code` (optional), `max_pages` (optional)
    - Results: `items`, `count`, `total_available`, `has_more`

    ### Product prices

    Sale prices of a product (GET /v1/sale-prices).

    - Action id: `product_prices`
    - Kind: read
    - Rivile ERP calls: `GET /v1/sale-prices`
    - Inputs: `product_code`, `price_category_code` (optional), `currency_code` (optional), `department_code` (optional)
    - Results: `prices`, `count`

    ### Changes since

    Records of one kind changed after a moment, from the list's updatedAt filter (updatedAt GREATER_THAN since).

    - Action id: `changes_since`
    - Kind: read
    - Rivile ERP calls: `GET of the chosen list`
    - Inputs: `entity`, `since`, `max_pages` (optional)
    - Results: `records`, `count`, `has_more`, `next_page`

    ### Client debt

    Open amounts of one client from the receivables and payables registry (GET /v1/pr-registries, totalBaseDue), with the overdue part.

    - Action id: `client_debt`
    - Kind: read
    - Rivile ERP calls: `GET /v1/pr-registries`
    - Inputs: `client_code`, `max_pages` (optional)
    - Results: `total_due`, `overdue`, `documents`, `count`, `has_more`
- component_id: operations_behaviour
  type: markdown
  title: How operations behave
  body: |
    ### Inputs

    - Every step needs a **connection**: the Rivile ERP API key it runs with.
    - Everyday steps take plain inputs. Codes your company sets up its own way — departments, units, money accounts, price categories — are inputs.
    - Advanced steps take the path ids, query parameters and a `body` with Rivile ERP's own field names (camelCase), as in the [Rivile ERP API reference](https://erp.rivile.cloud/public-api/swagger-ui/index.html). Where both an Id and a Code field exist (`clientId` / `clientCode`), either may be given.

    ### Lists and filters

    - Rivile returns at most 100 records per page. Pages count from 0. Set `page`, or turn on `fetch_all_pages` (up to `max_pages`).
    - `filters` are combined with AND. Each names a field Rivile documents for that list, an operation (EQUAL, CONTAINS, GREATER_THAN…) and a value. Dates are written YYYY-MM-DD, date-times YYYY-MM-DDTHH:MM:SS.SSSZ.
    - A step output has a size limit. A long read stops at the last page that fits and returns `has_more` and `next_page`. For whole lists use **Export a Rivile ERP list to a JSONL file**.

    ### Files

    - Rivile ERP's API can only download attached files. **Download document file** saves one as a workflow file. Attaching a file is not possible through the API.

    ### Writes, retries and errors

    - Every create, update, post, cancel, approve, reserve, link and delete goes through Flow Steward's external-effect record, so a retried step does not send it twice. Test runs never write.
    - **HTTP 400:** Rivile refused the data and nothing was saved. The step fails with Rivile's code and every refused field with its JSON path, for example `lines[0].itemCode`.
    - **401:** the API key is wrong, expired or deactivated. **404:** the record does not exist.
    - **Timeout, 5xx or a lost connection on a write:** Rivile may have saved it, and Rivile ERP has no idempotency key. The step fails as `timeout_unknown` and is not retried; check the record in Rivile ERP first.
    - Rivile stops a request after 5 minutes. Request bodies are limited to 5 MB.
    - If a step that writes several things fails half-way, it says exactly what was already created and is not retried.
    - Rivile ERP bills API use per request, according to a third-party source (not documented officially); a step that reads many pages sends many requests.
