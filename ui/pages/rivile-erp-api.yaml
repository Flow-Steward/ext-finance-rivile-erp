  body: |
    Every Rivile ERP Public API endpoint as its own step, named **Advanced · …** in the step picker and grouped below by area. Field names and types are Rivile's; the [Rivile ERP API reference](https://erp.rivile.cloud/public-api/swagger-ui/index.html) shows every schema, and the [Rivile guide](https://guide.rivile.cloud/integrative_solutions/api/api_usage) explains filters and limits.
