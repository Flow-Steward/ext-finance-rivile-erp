- component_id: advanced_any_endpoint
  type: markdown
  title: Any endpoint and exports
  body: |
    ### Call any Rivile ERP endpoint

    Sends one request to any Rivile ERP Public API path under /v1. Treated as a write whatever the method: suppressed in test runs and recorded in the external-effect ledger.

    - Action id: `call_endpoint` · write · any path under `/v1`
    - Inputs: `method`, `path`, `query` (optional), `body` (optional)
    - Results: `endpoint`, `response`, `http_status`, `duration_ms`

    ### Export a Rivile ERP list to a JSONL file

    Reads a Rivile ERP list page by page (100 records per page) and saves every record as one JSON line in a workflow file (rivile-erp-export.jsonl).

    - Action id: `export_list` · read · any path under `/v1`
    - Inputs: `list`, `filters` (optional), `max_pages` (optional), `start_page` (optional)
    - Results: `artifact_handle`, `filename`, `content_type`, `record_count`, `pages_fetched`, `complete`, `resume_page`, `total_elements`
- component_id: advanced_coverage
  type: markdown
  title: Coverage
  body: |
    - **Covered:** all 136 endpoints of the Rivile ERP Public API (43 read, 93 write), each as its own step, generated from Rivile's OpenAPI document.
    - **Inputs:** every path id and query parameter is its own input; every request body is one `body` input typed with Rivile's schema; list filters accept only the fields Rivile documents for that list.
    - **Newer than this release:** **Call any Rivile ERP endpoint** sends any path under `/v1` (always treated as a write).
    - **Not offered by the Rivile ERP API: attaching files.** The API has no upload; files can only be downloaded.
    - **Not offered: the GROUP filter operation.** It is in Rivile's enum, but its value is not described.
    - **Not offered: stock changes since a date.** The stock list does not document updatedAt as a filter field.
    - **Not offered: rate coordination across steps.** No rate limit is documented; HTTP 429 is still retried after 1, 2, 4 and 8 seconds within a step.
