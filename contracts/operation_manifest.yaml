- operation_id: get_products
  display_name: Advanced · List products
  description: 'List products. Up to 100 records per page; filters accept the fields Rivile documents
    for this list. Rivile ERP: GET /v1/products.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - createdAt
            - active
            - code
            - mainBarcode
            - importReference
            - productTypeId
            - priceStrategyId
            - bomTypeId
            - name
            - updatedAt
            - workflowStatusId
            - workflowStatusCode
            - mainProductGroupName
            - mainProductGroupCode
            - mainProductGroupId
            - isEcommerce
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, createdAt, active, code, mainBarcode,
        importReference, productTypeId, priceStrategyId, bomTypeId, name, updatedAt, workflowStatusId,
        workflowStatusCode, mainProductGroupName, mainProductGroupCode, mainProductGroupId, isEcommerce.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
  - name: size
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Fetch all pages
      description: Read page after page, up to max_pages, from page.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Max pages
      description: Upper bound for fetch_all_pages. Default 10.
  outputs:
  - name: endpoint
    value_type: text
    schema:
      type: string
      description: The Rivile ERP method and path called.
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
        description: Product list item response
        properties: &id029
          id:
            type: string
            description: Product ID
            format: uuid
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          active:
            type: boolean
            description: Is Product active
          activeFrom:
            type: string
            format: date
          activeTo:
            type: string
            format: date
          code:
            type: string
            description: Product code
          name:
            type: string
            description: Product name
          priceStrategyId:
            type: integer
            format: int32
          productTypeId:
            type: integer
            description: Product type ID (1 - product, 2 - service)
            format: int32
          bomTypeId:
            type: integer
            format: int32
          baseUomId:
            type: string
            format: uuid
          baseUomCode:
            type: string
          productAccountingCategoryId:
            type: string
            format: uuid
          productAccountingCategoryCode:
            type: string
          mainBarcode:
            type: string
          isAdditionalCost:
            type: boolean
            description: Is product additional cost service
          importReference:
            type: string
            description: Product import reference
          taxClassId:
            type: string
            format: uuid
          taxClassCode:
            type: string
          accountId:
            type: string
            format: uuid
          accountCode:
            type: string
          accountIncomeId:
            type: string
            format: uuid
          accountIncomeCode:
            type: string
          baseProductUom:
            type: object
            description: Product unit of measure item
            additionalProperties: true
          workflowStatusId:
            type: string
            format: uuid
          workflowStatusName:
            type: string
          workflowStatusCode:
            type: string
          isFormFuturePeriodsExpenses:
            type: boolean
          interimFutureExpensesAccountId:
            type: string
            format: uuid
          interimFutureExpensesAccountCode:
            type: string
          monthCount:
            type: integer
            format: int32
          isInventoryInMainUom:
            type: boolean
          description:
            type: string
          supplierProductCode:
            type: string
          countryOfOriginId:
            type: string
            format: uuid
          countryOfOriginCode:
            type: string
          customsCodeId:
            type: string
            format: uuid
          customsCode:
            type: string
          productSupplierId:
            type: string
            format: uuid
          productSupplierCode:
            type: string
          brand:
            type: string
          brandName:
            type: string
          county:
            type: string
          supplierProductName:
            type: string
          referenceCode:
            type: string
          mainProductGroupName:
            type: string
          mainProductGroupCode:
            type: string
          mainProductGroupId:
            type: string
            format: uuid
          isEcommerce:
            type: boolean
          productClass:
            type: string
          ext:
            type: object
            additionalProperties: true
          isGiftCard:
            type: boolean
          giftCardTypeId:
            type: integer
            format: int32
          validityPeriodInMonths:
            type: integer
            format: int32
        additionalProperties: true
      description: The page's records (content), field names as Rivile sends them.
  - name: record
    value_type: object
    schema:
      type:
      - object
      - 'null'
      description: The first record, or null.
      properties: *id029
      additionalProperties: true
