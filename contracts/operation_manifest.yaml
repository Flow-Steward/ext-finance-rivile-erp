- operation_id: get_purchase_orders
  display_name: Advanced · List purchase orders
  description: 'List purchase orders. Up to 100 records per page; filters accept the fields Rivile documents
    for this list. Rivile ERP: GET /v1/purchase-orders.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - createdAt
            - clientId
            - clientCode
            - journalId
            - journalCode
            - supplierAgreementId
            - supplierAgreementCode
            - isSent
            - opDate
            - docDate
            - documentNo
            - docReference
            - groupingCode
            - statusId
            - updatedAt
            - workflowStatusId
            - workflowStatusCode
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, createdAt, clientId, clientCode,
        journalId, journalCode, supplierAgreementId, supplierAgreementCode, isSent, opDate, docDate, documentNo,
        docReference, groupingCode, statusId, updatedAt, workflowStatusId, workflowStatusCode.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
  - name: size
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Fetch all pages
      description: Read page after page, up to max_pages, from page.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Max pages
      description: Upper bound for fetch_all_pages. Default 10.
