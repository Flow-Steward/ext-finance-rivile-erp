- operation_id: get_inventory_adjustments
  display_name: Advanced · List inventory adjustments
  description: 'List inventory adjustments. Up to 100 records per page; filters accept the fields Rivile
    documents for this list. Rivile ERP: GET /v1/inventory-adjustments.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - createdAt
            - updatedAt
            - documentNo
            - opDate
            - statusId
            - journalId
            - journalCode
            - sourcingMethod
            - gpaisSaleMethod
            - assigneeId
            - committeeId
            - docReference
            - importReference
            - notes
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, createdAt, updatedAt, documentNo,
        opDate, statusId, journalId, journalCode, sourcingMethod, gpaisSaleMethod, assigneeId, committeeId,
        docReference, importReference, notes.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
  - name: size
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Fetch all pages
      description: Read page after page, up to max_pages, from page.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Max pages
      description: Upper bound for fetch_all_pages. Default 10.
  outputs:
  - name: endpoint
    value_type: text
    schema:
      type: string
      description: The Rivile ERP method and path called.
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
        description: Inventory adjustment list item response
        properties: &id023
          id:
            type: string
            description: Inventory adjustment ID
            format: uuid
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          documentNo:
            type: string
          opDate:
            type: string
            format: date
          statusId:
            type: integer
            format: int32
          statusName:
            type: string
          typeId:
            type: integer
            format: int32
          typeName:
            type: string
          journalId:
            type: string
            format: uuid
          journalCode:
            type: string
          assigneeId:
            type: string
            format: uuid
          assigneeCode:
            type: string
          committeeId:
            type: string
            format: uuid
          committeeCode:
            type: string
          docReference:
            type: string
          importReference:
            type: string
          gpaisSaleMethod:
            type: string
          sourcingMethod:
            type: string
          totalAmount:
            type: number
          notes:
            type: string
        additionalProperties: true
      description: The page's records (content), field names as Rivile sends them.
  - name: record
    value_type: object
    schema:
      type:
      - object
      - 'null'
      description: The first record, or null.
      properties: *id023
      additionalProperties: true
  - name: count
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: total_elements
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Rivile's totalElements.
  - name: total_pages
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Rivile's totalPages.
  - name: page_number
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The last page read.
  - name: next_page
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The page to read next when has_more is true, else null.
  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
  - name: http_status
    value_type: integer
    schema:
      type: integer
  - name: duration_ms
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
