    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
