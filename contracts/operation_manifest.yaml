            - updatedAt
            - workflowStatusId
            - workflowStatusCode
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, createdAt, clientId, clientCode,
