    value_type: text
    required: false
    schema:
      type: string
      title: File id
      description: The attachment's id, as listed in a document's attachments.
      maxLength: 36
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: document_type
    value_type: text
    required: false
    schema:
      type: string
