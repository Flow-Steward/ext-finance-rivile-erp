    value_type: text
    schema:
      type: string
      description: The Rivile ERP method and path called.
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
        description: PrRegistry list item response
        properties: &id032
          id:
            type: string
            format: uuid
          companyId:
            type: string
            format: uuid
          refModuleId:
            type: integer
            format: int32
          refId:
            type: string
            format: uuid
          clientId:
            type: string
            format: uuid
          clientCode:
            type: string
          clientName:
            type: string
          typeId:
            type: integer
            format: int32
          typeName:
            type: string
          date:
            type: string
            format: date
          documentNo:
            type: string
          dueDate:
            type: string
            format: date
          departmentId:
            type: string
            format: uuid
          departmentCode:
            type: string
          objectId:
            type: string
            format: uuid
          objectCode:
            type: string
          dimensionId:
            type: string
            format: uuid
          dimensionCode:
            type: string
          dimension:
            type: object
            description: Dimension response
            additionalProperties: true
          accountId:
            type: string
            format: uuid
          baseDeb:
            type: number
          baseCre:
            type: number
          currencyId:
            type: string
            format: uuid
          currencyCode:
            type: string
          curDeb:
            type: number
          curCre:
            type: number
          totalBaseDue:
            type: number
          totalCurDue:
            type: number
          statusId:
            type: integer
            format: int32
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          adjustmentItemId:
            type: string
            format: uuid
          adjustmentId:
            type: string
            format: uuid
          reconciliationId:
            type: string
            format: uuid
          isLocked:
            type: boolean
          isFixed:
