      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - clientId
            - clientCode
            - clientName
            - documentNo
            - date
            - dueDate
            - totalCurDue
            - refModuleId
            - refId
            - typeId
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, clientId, clientCode, clientName,
        documentNo, date, dueDate, totalCurDue, refModuleId, refId, typeId.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
