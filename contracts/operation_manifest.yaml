      - delivery
      - inventory_adjustment
      - inventory_movement
      - manufacture
      - payment
      - product
      - purchase_invoice
      - purchase_order
      - sale_invoice
      - sale_order
      title: Document type
      description: The kind of record the file is attached to.
  - name: document_id
    value_type: text
    required: false
    schema:
      type: string
      title: Document id
      description: The id (UUID) of the record the file is attached to.
      maxLength: 36
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: file_name
    value_type: text
    required: false
    schema:
      type: string
      title: File name
      description: 'Take the attachment with this name. Default: the first attachment.'
      maxLength: 255
