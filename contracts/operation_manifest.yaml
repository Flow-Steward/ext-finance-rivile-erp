  effect_kind: rivile_erp_call_endpoint
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: method
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - GET
      - POST
      - PATCH
      - PUT
      - DELETE
      title: HTTP method
      description: The HTTP method of the endpoint, as in the API reference.
  - name: path
    value_type: text
    required: true
    schema:
      type: string
      pattern: ^/v1/[A-Za-z0-9/_.-]{1,200}$
      maxLength: 210
      title: Path
      description: A Rivile ERP Public API path under /v1, with ids filled in, for example /v1/sale-invoices/3fa85f64-5717-4562-b3fc-2c963f66afa6.
        For endpoints Rivile adds after this release; prefer the dedicated operation when one exists.
  - name: query
    value_type: object
    required: false
    schema:
      type: object
      title: Query
      description: Query parameters (text, numbers or true/false).
      additionalProperties:
        type:
        - string
        - number
        - boolean
  - name: body
    value_type: json
    required: false
    schema:
      title: Body
      description: The JSON request body, sent unchanged.
  outputs:
  - name: endpoint
    value_type: text
    schema:
      type: string
  - name: response
    value_type: json
    schema:
      description: Rivile ERP's JSON answer, unchanged. A non-JSON answer (a file) comes as {content_type,
        size_bytes, base64}, with base64 only up to 1 MB.
  - name: http_status
    value_type: integer
    schema:
      type: integer
  - name: duration_ms
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.endpoint
  - result.response
  - result.http_status
  - result.duration_ms
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - invalid_connection
  - unsupported_operation
  - internal_error
  - authentication_failed
  - not_found
  - rate_limited
  - upstream_validation_failed
  - upstream_failure
  - invalid_json_response
  - response_too_large
  - timeout
  - connection_failed
  - redirect_rejected
  - blocked_address
  - timeout_unknown
- operation_id: export_list
  display_name: Advanced · Export a Rivile ERP list to a JSONL file
  description: Reads a Rivile ERP list page by page (100 records per page) and saves every record as one
    JSON line in a workflow file (rivile-erp-export.jsonl).
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: list
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - /v1/clients
      - /v1/contacts
      - /v1/deliveries
      - /v1/employees
      - /v1/gift-cards
      - /v1/inventory-adjustments
      - /v1/inventory-movements
      - /v1/inventory-stocks
      - /v1/lots
      - /v1/manufactures
      - /v1/payments
      - /v1/products
      - /v1/purchase-invoices
      - /v1/purchase-orders
      - /v1/pr-registries
      - /v1/sale-invoices
      - /v1/sale-orders
      - /v1/sale-prices
      - /v1/timesheet-schedules
      title: List
      description: The Rivile ERP list to export page by page (its GET path).
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      title: Filters
      description: 'Conditions combined with AND: field (one documented for that list), operation, value
        — as on the list''s own operation.'
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            pattern: ^\w{1,64}$
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 2000
      title: Max pages
      description: Upper bound of pages (100 records each). Default 2000. The export also stops before
        the step time limit and reports resume_page.
  - name: start_page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Start page
      description: First page to read (from 0); pass resume_page to continue.
  outputs:
  - name: artifact_handle
    value_type: artifact_handle
  - name: filename
    value_type: text
    schema:
      type: string
  - name: content_type
    value_type: text
    schema:
      type: string
  - name: record_count
    value_type: integer
    schema:
      type: integer
  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: complete
    value_type: boolean
    schema:
      type: boolean
  - name: resume_page
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: 'When complete is false: the start_page that continues the export.'
  - name: total_elements
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
  - name: stopped_by
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: Why the export stopped before the end (time, or an error on a later page); every page
        read before it is in the file.
  result_fields:
  - result.artifact_handle
  - result.filename
  - result.content_type
  - result.record_count
  - result.pages_fetched
  - result.complete
  - result.resume_page
  - result.total_elements
  - result.stopped_by
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - invalid_connection
  - unsupported_operation
  - internal_error
  - authentication_failed
  - not_found
  - rate_limited
  - upstream_validation_failed
  - upstream_failure
  - invalid_json_response
  - response_too_large
  - timeout
  - connection_failed
  - redirect_rejected
  - blocked_address
  - artifact_output_unavailable
