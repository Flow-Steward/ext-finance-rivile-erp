  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
  - name: http_status
    value_type: integer
    schema:
      type: integer
  - name: duration_ms
    value_type: integer
    schema:
      type:
      - integer
