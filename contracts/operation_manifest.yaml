  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
  - name: http_status
    value_type: integer
    schema:
      type: integer
  - name: duration_ms
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
  result_fields:
  - result.endpoint
  - result.records
  - result.record
  - result.count
  - result.total_elements
  - result.total_pages
  - result.page_number
  - result.next_page
  - result.pages_fetched
  - result.has_more
  - result.http_status
  - result.duration_ms
