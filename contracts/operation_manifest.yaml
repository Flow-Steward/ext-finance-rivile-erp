- operation_id: get_inventory_stocks
  display_name: Advanced · List inventory stock
  description: 'List inventory stock. Up to 100 records per page; filters accept the fields Rivile documents
    for this list. Rivile ERP: GET /v1/inventory-stocks.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - productId
            - productCode
            - serial
            - uomId
            - uomCode
            - departmentId
            - departmentCode
            - lotId
            - lotCode
            - markId
            - markCode
            - objectId
            - objectCode
            - qtyAltAvailable
            - qtyAltWarehouse
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: productId, productCode, serial, uomId,
        uomCode, departmentId, departmentCode, lotId, lotCode, markId, markCode, objectId, objectCode,
        qtyAltAvailable, qtyAltWarehouse.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
