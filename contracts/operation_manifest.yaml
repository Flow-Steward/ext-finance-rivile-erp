- operation_id: get_clients
  display_name: Advanced · List clients
  description: 'List clients. Up to 100 records per page; filters accept the fields Rivile documents for
    this list. Rivile ERP: GET /v1/clients.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - createdAt
            - priceCategoryId
            - importReference
            - active
            - code
            - typeId
            - regCode
            - vatNumber
            - name
            - email
            - isCustomer
            - isSupplier
            - updatedAt
            - workflowStatusId
            - workflowStatusCode
            - economicActivity
            description: A documented field.
          operation:
            type: string
            enum: &id018
            - EQUAL
            - NOT_EQUAL
            - CONTAINS
            - NOT_CONTAINS
            - STARTS_WITH
            - ENDS_WITH
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, createdAt, priceCategoryId, importReference,
        active, code, typeId, regCode, vatNumber, name, email, isCustomer, isSupplier, updatedAt, workflowStatusId,
        workflowStatusCode, economicActivity.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
  - name: size
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Fetch all pages
      description: Read page after page, up to max_pages, from page.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Max pages
      description: Upper bound for fetch_all_pages. Default 10.
  outputs:
  - name: endpoint
    value_type: text
    schema:
      type: string
      description: The Rivile ERP method and path called.
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
        description: Client list item response
        properties: &id017
          id:
            type: string
            description: Client ID
            format: uuid
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          active:
            type: boolean
            description: Is client active
          activeFrom:
            type: string
            format: date
          activeTo:
            type: string
            format: date
          typeId:
            type: integer
            description: Client type ID
            format: int32
          taxCodeTypeId:
            minimum: 1
            type: integer
            description: Client tax code type ID
            format: int32
          code:
            type: string
            description: Client code
          name:
            type: string
            description: Client name
          address:
            type: string
            description: Client address
          email:
            type: string
            description: Client email
          phone:
            type: string
            description: Client phone
          economicActivity:
            type: string
            description: Client economic activity
          regCode:
            type: string
            description: Client registration code
          vatNumber:
            type: string
            description: Client VAT number
          isCustomer:
            type: boolean
            description: Is client customer
          isSupplier:
            type: boolean
            description: Is client supplier
          customerTaxCategoryId:
            type: string
            format: uuid
          customerTaxCategoryCode:
            type: string
          supplierTaxCategoryId:
            type: string
            format: uuid
          supplierTaxCategoryCode:
            type: string
          priceCategoryId:
            type: string
            format: uuid
          priceCategoryCode:
            type: string
          accountingCategoryId:
            type: string
            format: uuid
          accountingCategoryCode:
            type: string
          customerIncotermId:
            type: string
            format: uuid
          customerIncotermCode:
            type: string
          supplierIncotermId:
            type: string
            format: uuid
          supplierIncotermCode:
            type: string
          customerPaymentTermId:
            type: string
            format: uuid
          customerPaymentTermCode:
            type: string
          supplierPaymentTermId:
            type: string
            format: uuid
          supplierPaymentTermCode:
            type: string
          autoReconciliationTypeId:
            type: integer
            format: int32
          isafSpecTax:
            type: boolean
          dateOfBirth:
            type: string
            format: date
          importReference:
            type: string
            description: Client import reference
          referenceCode:
            type: string
          workflowStatusId:
            type: string
            format: uuid
          workflowStatusName:
            type: string
          workflowStatusCode:
            type: string
          ext:
            type: object
            additionalProperties: true
          transactionCode:
            type: string
          transportType:
            type: string
          socialInsuranceCode:
            type: string
          gpaisSaleMethod:
            type: string
          accountSupplierInGpais:
            type: boolean
          leadSource:
            type: string
          description:
            type: string
          payerId:
            type: string
            format: uuid
          payerCode:
            type: string
          recipientId:
            type: string
            format: uuid
          recipientCode:
            type: string
          additionalEmails:
            type: array
            items: {}
        additionalProperties: true
      description: The page's records (content), field names as Rivile sends them.
  - name: record
