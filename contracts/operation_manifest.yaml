- operation_id: get_sale_prices
  display_name: Advanced · List sale prices
  description: 'List sale prices. Up to 100 records per page; filters accept the fields Rivile documents
    for this list. Rivile ERP: GET /v1/sale-prices.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - rivile_erp
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - field
        - operation
        - value
        properties:
          field:
            type: string
            enum:
            - id
            - validFrom
            - validTo
            - productId
            - productCode
            - departmentId
            - departmentCode
            - currencyId
            - currencyCode
            - priceCategoryId
            - priceCategoryCode
            - updatedAt
            description: A documented field.
          operation:
            type: string
            enum: *id018
          value:
            type:
            - string
            - number
            - boolean
            description: Text, number or true/false. Dates as YYYY-MM-DD, date-times as YYYY-MM-DDTHH:MM:SS.SSSZ.
      title: Filters
      description: 'Conditions combined with AND, for example [{"field": "code", "operation": "EQUAL",
        "value": "000005"}]. Fields Rivile documents for this list: id, validFrom, validTo, productId,
        productCode, departmentId, departmentCode, currencyId, currencyCode, priceCategoryId, priceCategoryCode,
        updatedAt.'
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000
      title: Page
      description: Page number, counted from 0. Default 0.
  - name: size
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Page size
      description: Records per page, 1 to 100 (Rivile's limit). Default 100.
  - name: fetch_all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Fetch all pages
      description: Read page after page, up to max_pages, from page.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: Max pages
      description: Upper bound for fetch_all_pages. Default 10.
  outputs:
  - name: endpoint
    value_type: text
    schema:
      type: string
      description: The Rivile ERP method and path called.
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
        description: Sale price item response
        properties: &id035
          id:
            type: string
            format: uuid
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          priceExcludingTax:
            type: number
          priceIncludingTax:
            type: number
          validFrom:
            type: string
            format: date
          validTo:
            type: string
            format: date
          productId:
            type: string
            format: uuid
          productCode:
            type: string
          currencyId:
            type: string
            format: uuid
          currencyCode:
            type: string
          departmentId:
            type: string
            format: uuid
          departmentCode:
            type: string
          priceCategoryId:
            type: string
            format: uuid
          priceCategoryCode:
            type: string
          productUnitOfMeasureId:
            type: string
            format: uuid
          productUnitOfMeasureCode:
            type: string
          importReference:
            type: string
        additionalProperties: true
      description: The page's records (content), field names as Rivile sends them.
  - name: record
    value_type: object
    schema:
      type:
      - object
      - 'null'
      description: The first record, or null.
      properties: *id035
      additionalProperties: true
  - name: count
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: total_elements
    value_type: integer
    schema:
      type:
      - integer
