          taxCategoryId:
            type: string
            format: uuid
          statusId:
            type: integer
            format: int32
          typeId:
            type: integer
            format: int32
          totalItemAmount:
            type: number
          totalTaxAmount:
            type: number
          totalAmount:
            type: number
          isCurrency:
