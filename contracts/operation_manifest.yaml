      type: string
      title: Currency
      description: 'The currency code. Default: the base currency.'
      maxLength: 50
  - name: date
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: 'The payment date, YYYY-MM-DD. Default: today.'
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
