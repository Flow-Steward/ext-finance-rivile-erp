connection_types:
  - connection_type_id: rivile_erp
    display_name: Rivile ERP API key
    description: One Rivile ERP API key. Each key belongs to one Rivile ERP company.
    auth:
      type: api_key
    config_schema:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 190
          title: Label
          description: Optional name for this connection, for example the company.
        language:
          type: string
          enum: [en, lt]
          default: en
          title: Message language
          description: The language of Rivile ERP's messages and error texts (Accept-Language).
    secret_schema:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 1024
          title: API key
          description: The key created in Rivile ERP under Nustatymai → Bendrieji → API Raktai. It is shown only once.
    capabilities:
      test_connection: true
