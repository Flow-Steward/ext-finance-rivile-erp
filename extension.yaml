manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.rivile-erp
kind: tool_provider
version: 0.1.4
release_stage: active
billing_mode: free
display_name: Rivile ERP
description: 'Bring Rivile ERP cloud accounting and operational records into Flow Steward workflows. Everyday
  steps find or create customers, suppliers and products, create sales and purchase invoices with document
  lines and optional posting, register payments, download attached document files and read stock, prices
  and client debt. Changes-since reads help pass updated records to another system.


  The release also exposes a registry of 136 Public API endpoints as typed advanced operations. Its supported
  families include clients and contacts, products, sales and purchase orders and invoices, deliveries,
  payments, receivables and payables, inventory adjustments and movements, lots, manufacturing, gift cards,
  employees, timesheets and workflow statuses. Supported endpoint actions include reads, creation, updates
  and deletion where the particular API route permits them. List export writes JSONL files for larger
  exchanges.


  Combine these capabilities to turn storefront orders into accounting documents, exchange warehouse availability,
  build payment-registration workflows or connect operational records to reporting. A company-specific
  API key determines the connection''s access. Invoice steps support optional posting, and advanced operations
  expose the individual document and line actions when a process needs more control. Lists and file exports
  provide records for subsequent workflow steps.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-rivile-erp/issues
  website_url: https://github.com/Flow-Steward/ext-finance-rivile-erp
listing:
  category: finance
  tags:
  - rivile
  - rivile-erp
  - accounting
  - erp
  - lithuania
  - invoices
  - inventory
  - orders
  summary: Connect Rivile ERP cloud invoices, clients, products, payments and stock, with order, delivery,
    manufacturing and workforce API operations.
  categories:
  - finance
  - inventory
  - sales
  - hr
  setup_summary: Create a company API key in Rivile ERP under Settings, General, API Keys, choose its
    validity and store it in the project connection. Use a separate connection for each company and confirm
    that the key permits the document and operational actions your workflow needs.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_rivile_erp
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each Rivile ERP API key is a project connection for one Rivile ERP company. A project may
    hold several, for example one per company.
egress:
  hosts:
  - erp.rivile.cloud
